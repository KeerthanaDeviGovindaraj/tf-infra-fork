name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'aws/**'
      - 'gcp/**'
      - '.github/workflows/terraform-ci.yml'

jobs:
  terraform-aws:
    name: Terraform AWS - Format and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check (AWS)
        run: |
          cd aws
          terraform fmt -check -recursive

      - name: Terraform Init (AWS)
        run: |
          cd aws
          terraform init -backend=false

      - name: Terraform Validate (AWS)
        run: |
          cd aws
          terraform validate

  terraform-gcp:
    name: Terraform GCP - Format and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check (GCP)
        run: |
          cd gcp
          terraform fmt -check -recursive

      - name: Terraform Init (GCP)
        run: |
          cd gcp
          terraform init -backend=false

      - name: Terraform Validate (GCP)
        run: |
          cd gcp
          terraform validate